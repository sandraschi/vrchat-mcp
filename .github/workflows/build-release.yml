name: Build and Release VRChat MCP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-vrchat-mcp:
    name: Build VRChat MCP - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-platform VRChat MCP support
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vrchat-mcp.exe
            archive: vrchat-mcp-windows-x64.zip
            
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vrchat-mcp
            archive: vrchat-mcp-linux-x64.tar.gz
            
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: vrchat-mcp
            archive: vrchat-mcp-macos-x64.tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(git describe --tags --always --dirty)
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "Building VRChat MCP version: ${VERSION}"

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy, rustfmt

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
        cache-on-failure: true

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      run: |
        brew install pkg-config openssl
        echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV

    - name: Build VRChat MCP
      run: |
        cargo build --release --target ${{ matrix.target }} --verbose

    - name: Verify binary
      shell: bash
      run: |
        RELEASE_DIR="target/${{ matrix.target }}/release"
        
        if [[ -f "${RELEASE_DIR}/${{ matrix.binary }}" ]]; then
          echo "✅ VRChat MCP binary found: ${{ matrix.binary }}"
          ls -la "${RELEASE_DIR}/${{ matrix.binary }}"
        else
          echo "❌ VRChat MCP binary not found: ${{ matrix.binary }}"
          exit 1
        fi

    - name: Create installation package
      shell: bash
      run: |
        mkdir -p dist
        
        # Copy binary
        cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
        
        # Create platform-specific installation script
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          cat > dist/install.bat << 'EOF'
@echo off
echo VRChat MCP Installation
echo =======================

echo.
echo Installing VRChat MCP server...

echo.
echo Add to Claude Desktop config:
echo {
echo   "mcpServers": {
echo     "vrchat": {
echo       "command": "%~dp0vrchat-mcp.exe",
echo       "args": []
echo     }
echo   }
echo }
echo.
echo VRChat MCP Tools:
echo - vrchat_login: Authenticate with VRChat
echo - search_avatars: Find and browse avatars
echo - search_worlds: Discover VRChat worlds
echo - get_friends: List friends and their status
echo - join_world: Join a VRChat world instance
echo - favorite_avatar: Manage avatar favorites
echo.
pause
EOF
        else
          cat > dist/install.sh << 'EOF'
#!/bin/bash
echo "VRChat MCP Installation"
echo "======================"
echo

# Check if running as root for system install
if [[ $EUID -eq 0 ]]; then
    INSTALL_DIR="/usr/local/bin"
    echo "Installing system-wide to ${INSTALL_DIR}"
else
    INSTALL_DIR="$HOME/.local/bin"
    mkdir -p "${INSTALL_DIR}"
    echo "Installing user-local to ${INSTALL_DIR}"
fi

# Copy binary
echo "Installing VRChat MCP server..."
cp "vrchat-mcp" "${INSTALL_DIR}/"
chmod +x "${INSTALL_DIR}/vrchat-mcp"
echo "✅ VRChat MCP installed to ${INSTALL_DIR}/vrchat-mcp"

echo
echo "Add to Claude Desktop config:"
echo "{"
echo "  \"mcpServers\": {"
echo "    \"vrchat\": {"
echo "      \"command\": \"${INSTALL_DIR}/vrchat-mcp\","
echo "      \"args\": []"
echo "    }"
echo "  }"
echo "}"
echo
echo "VRChat MCP Tools:"
echo "- vrchat_login: Authenticate with VRChat"  
echo "- search_avatars: Find and browse avatars"
echo "- search_worlds: Discover VRChat worlds"
echo "- get_friends: List friends and their status"
echo "- join_world: Join a VRChat world instance"
echo "- favorite_avatar: Manage avatar favorites"
echo
EOF
          chmod +x dist/install.sh
        fi
        
        # Create README
        cat > dist/README.md << 'EOF'
# VRChat MCP - VRChat Integration for Claude Desktop

## Installation

### Windows
Run `install.bat` and follow the instructions to configure Claude Desktop.

### Linux/macOS  
Run `./install.sh` and follow the instructions to configure Claude Desktop.

## VRChat MCP Tools

- **vrchat_login**: Authenticate with your VRChat account
- **search_avatars**: Find and browse VRChat avatars
- **search_worlds**: Discover VRChat worlds and instances
- **get_friends**: List friends and their online status
- **join_world**: Join a specific VRChat world instance
- **favorite_avatar**: Manage your avatar favorites
- **get_user_info**: Get detailed user profile information

## Requirements

- VRChat account with API access
- Claude Desktop with MCP support
- Internet connection for VRChat API

## Support

GitHub: https://github.com/sandraschi/vrchat-mcp
Documentation: See docs/CLAUDE-CODE-WORKTREES.md for advanced development
EOF
        
        # Create archive
        cd dist
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          7z a -tzip "../${{ matrix.archive }}" ./*
        else
          tar czf "../${{ matrix.archive }}" ./*
        fi
        cd ..

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: vrchat-mcp-${{ matrix.platform }}
        path: ${{ matrix.archive }}
        retention-days: 30

  create-vrchat-release:
    name: Create VRChat MCP Release
    needs: build-vrchat-mcp
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release-files
        find artifacts -name "*.zip" -o -name "*.tar.gz" | while read file; do
          cp "$file" release-files/
        done
        
        # Generate checksums
        cd release-files
        sha256sum * > CHECKSUMS.sha256
        cd ..
        
        echo "VRChat MCP release files:"
        ls -la release-files/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*
        draft: false
        prerelease: false
        body: |
          ## VRChat MCP Release ${{ github.ref_name }}
          
          **VRChat Integration for Claude Desktop**
          
          This release provides comprehensive VRChat integration through the Model Context Protocol (MCP), enabling natural language interaction with VRChat's social 3D platform.
          
          ### Installation
          
          1. **Download** the appropriate package for your platform
          2. **Extract** the archive to your desired location
          3. **Run** the installation script (`install.bat` on Windows, `install.sh` on Linux/macOS)
          4. **Configure** Claude Desktop with the provided configuration
          5. **Authenticate** with VRChat using the `vrchat_login` tool
          
          ### VRChat MCP Tools
          
          - **vrchat_login**: Secure VRChat authentication with 2FA support
          - **search_avatars**: Find and browse VRChat avatars with filters
          - **search_worlds**: Discover VRChat worlds and instances
          - **get_friends**: List friends and their online status
          - **join_world**: Join specific VRChat world instances
          - **favorite_avatar**: Manage your avatar favorites
          - **get_user_info**: Get detailed user profile information
          
          ### Platform Support
          
          - **Windows x64**: Full VRChat API integration
          - **Linux x64**: Complete VRChat functionality
          - **macOS x64**: Full platform support
          
          ### Requirements
          
          - VRChat account with valid credentials
          - Claude Desktop 0.10.0+ with MCP support
          - Internet connection for VRChat API access
          
          ### Advanced Development
          
          For complex VRChat MCP development, see `docs/CLAUDE-CODE-WORKTREES.md` for the revolutionary parallel development pattern using Claude Code worktrees.
          
          ### Support
          
          - **Documentation**: [GitHub Repository](https://github.com/sandraschi/vrchat-mcp)
          - **Issues**: [GitHub Issues](https://github.com/sandraschi/vrchat-mcp/issues)
          - **Advanced Development**: Claude Code Worktrees pattern documentation
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
