[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
pythonpath = . src
addopts = -v --cov=vrchat_mcp --cov-report=term-missing

[coverage:run]
source = vrchat_mcp
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
show_missing = true
skip_covered = true
fail_under = 80
