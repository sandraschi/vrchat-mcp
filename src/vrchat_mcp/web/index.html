<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat MCP Debugger</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 shadow-md">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">VRChat MCP Debugger</h1>
                <div id="connection-status" class="flex items-center">
                    <span class="h-3 w-3 rounded-full bg-red-500 mr-2"></span>
                    <span>Disconnected</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Message List -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-md p-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">OSC Messages</h2>
                    <div class="flex space-x-2">
                        <button id="clear-messages" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded">
                            <i class="fas fa-trash-alt"></i> Clear
                        </button>
                        <button id="pause-messages" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded">
                            <i class="fas fa-pause"></i> Pause
                        </button>
                    </div>
                </div>
                
                <!-- Message Filters -->
                <div class="bg-gray-50 p-3 rounded mb-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Address Filter</label>
                            <input type="text" id="address-filter" placeholder="/avatar/parameters/*" 
                                   class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Direction</label>
                            <select id="direction-filter" class="w-full p-2 border rounded">
                                <option value="all">All</option>
                                <option value="INCOMING">Incoming</option>
                                <option value="OUTGOING">Outgoing</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button id="apply-filters" class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700">
                                Apply Filters
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Message Table -->
                <div class="overflow-auto max-h-[60vh] border rounded">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Time</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Direction</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Address</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Value</th>
                            </tr>
                        </thead>
                        <tbody id="message-list" class="bg-white divide-y divide-gray-200 text-sm">
                            <!-- Messages will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Sidebar -->
            <div class="space-y-6">
                <!-- Status Panel -->
                <div class="bg-white rounded-lg shadow-md p-4">
                    <h2 class="text-xl font-semibold mb-4">Status</h2>
                    <div id="status-panel" class="space-y-2">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Server:</span>
                            <span id="server-status" class="font-mono">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Messages:</span>
                            <span id="message-count" class="font-mono">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Incoming:</span>
                            <span id="bytes-in" class="font-mono">0 B</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Outgoing:</span>
                            <span id="bytes-out" class="font-mono">0 B</span>
                        </div>
                    </div>
                </div>
                
                <!-- Send Message Panel -->
                <div class="bg-white rounded-lg shadow-md p-4">
                    <h2 class="text-xl font-semibold mb-4">Send OSC Message</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                            <input type="text" id="send-address" placeholder="/avatar/parameters/Example" 
                                   class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Value</label>
                            <input type="text" id="send-value" placeholder="1.0" 
                                   class="w-full p-2 border rounded">
                        </div>
                        <button id="send-message" class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700">
                            Send Message
                        </button>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="bg-gray-800 text-white p-4 text-center text-sm">
            VRChat MCP Debugger &copy; 2023
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
